name: Tiny3D Build

on:
  # push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install MSVC v142 toolset
        shell: pwsh
        run: |
          $workloads = @(
            '--add Microsoft.VisualStudio.Component.VC.v141.x86.x64'
            '--add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64'
            '--add Microsoft.VisualStudio.ComponentGroup.VC.Tools.142.x86.x64'
          )
          $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $args = @('modify', '--installPath', "`"$vsPath`"") + $workloads + @('--quiet', '--norestart', '--wait')
          Start-Process -FilePath $vsInstaller -ArgumentList $args -Wait -NoNewWindow
          Write-Host "v142 toolset installation completed"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          pip install openpyxl pandas

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.29'

      - name: "Pre-generate Language.h for Editor and Launcher"
        shell: cmd
        working-directory: source
        run: |
          mkdir Editor\TinyEditor\Language 2>nul
          mkdir Editor\TinyLauncher\Language 2>nul
          python Tools\LanguageGenerator\excel_to_hpp.py Tools\LanguageGenerator\Editor\lang-zh-hans.xlsx Editor\TinyEditor\Language\Language.h Tools\LanguageGenerator\Editor\lang-zh-hans.txt
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%
          python Tools\LanguageGenerator\excel_to_hpp.py Tools\LanguageGenerator\Launcher\lang-zh-hans.xlsx Editor\TinyLauncher\Language\Language.h Tools\LanguageGenerator\Launcher\lang-zh-hans.txt
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Configure
        shell: cmd
        working-directory: source
        run: |
          rmdir /Q /S vs2019-x64 2>nul
          rmdir /Q /S lib 2>nul
          rmdir /Q /S bin 2>nul
          mkdir vs2019-x64 && cd vs2019-x64
          cmake -G "Visual Studio 17 2022" -T v142 -A x64 -DTINY3D_BUILD_RTTR_TOOL=OFF -DTINY3D_COPY_RESOURCE=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ../
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Build
        shell: cmd
        working-directory: source/vs2019-x64
        run: |
          cmake --build . --config ${{ matrix.build_type }} -- /maxcpucount
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tiny3D-Windows-x64-${{ matrix.build_type }}
          path: |
            source/bin/Windows/${{ matrix.build_type }}/
            source/lib/Windows/${{ matrix.build_type }}/
          retention-days: 7

      - name: Upload generated reflection files
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Reflection-${{ matrix.build_type }}
          path: |
            source/vs2019-x64/Math/Generated/
            source/vs2019-x64/System/Generated/
            source/vs2019-x64/Core/Runtime/Generated/
            source/vs2019-x64/Core/Editor/Generated/
          retention-days: 7
          if-no-files-found: warn
