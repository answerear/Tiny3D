apply plugin: 'com.android.application'

// ===========================================================================
// Host RPP (ReflectionPreprocessor) auto-build configuration
// ===========================================================================
def sourceDir = file("../../../../")  // => source/

android {
    namespace 'com.tiny3d.hello'
    compileSdk 33
    defaultConfig {
        applicationId "com.tiny3d.hello"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions -Wno-undefined-var-template -Wparentheses -ferror-limit=0"
                arguments "-DTINY3D_BUILD_SAMPLES=TRUE", "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-26"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DTINY3D_HOST_RPP=${new File(sourceDir, "bin/Windows/Debug/rpp.exe").absolutePath.replace('\\', '/')}"
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DTINY3D_HOST_RPP=${new File(sourceDir, "bin/Windows/Release/rpp.exe").absolutePath.replace('\\', '/')}"
                }
            }
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    externalNativeBuild {
        cmake {
            path "../../../../CMakeLists.txt"
            // NOTE: CMake version is determined by NDK (3.18.1 for NDK 24).
            // Do not pin a specific version here.
        }
    }
    buildToolsVersion '33.0.2'
    ndkVersion '24.0.8215888'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

ext.tiny3dSourceDir = sourceDir
apply from: "${sourceDir}/Platform/Android/tiny3d-build-host-rpp.gradle"

// NOTE: SDL2 prebuilt .so files for Android are currently missing.
// You need to build SDL2 for Android (arm64-v8a, armeabi-v7a) and place them in:
//   dependencies/sdl2/prebuilt/android/arm64-v8a/bin/
//   dependencies/sdl2/prebuilt/android/armeabi-v7a/bin/
// Otherwise the native link step will fail.

dependencies {
    implementation project(':Tiny3DLib:Tiny3D')

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
