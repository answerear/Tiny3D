apply plugin: 'com.android.application'

// ===========================================================================
// Host RPP (ReflectionPreprocessor) auto-build configuration
// ===========================================================================
def sourceDir = file("../../../../") // => source/
def rppBuildDir = new File(sourceDir, "build-rpp-host")

android {
    namespace 'com.tiny3d.inputapp'
    compileSdk 33
    defaultConfig {
        applicationId "com.tiny3d.inputapp"
        minSdkVersion 26
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions -Wno-undefined-var-template -Wparentheses -ferror-limit=0"
                arguments "-DTINY3D_BUILD_SAMPLES=TRUE", "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-26"
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DTINY3D_HOST_RPP=${new File(sourceDir, "bin/Windows/Debug/rpp.exe").absolutePath.replace('\\', '/')}"
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            externalNativeBuild {
                cmake {
                    arguments "-DTINY3D_HOST_RPP=${new File(sourceDir, "bin/Windows/Release/rpp.exe").absolutePath.replace('\\', '/')}"
                }
            }
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    externalNativeBuild {
        cmake {
            path "../../../../CMakeLists.txt"
        }
    }
    buildToolsVersion '33.0.2'
    ndkVersion '24.0.8215888'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// ===========================================================================
// Auto-build host rpp.exe before Android native build (per buildType)
// ===========================================================================
android.applicationVariants.all { variant ->
    def buildTypeName = variant.buildType.name
    def buildTypeCapitalized = buildTypeName.capitalize()
    def rppExe = new File(sourceDir, "bin/Windows/${buildTypeCapitalized}/rpp.exe")

    def taskName = "buildHostRpp${buildTypeCapitalized}"

    if (tasks.findByName(taskName) == null) {
        tasks.create(taskName) {
            group = 'build setup'
            description = "Build host rpp.exe (${buildTypeCapitalized}) for cross-compilation reflection generation"

            onlyIf { !rppExe.exists() }

            doLast {
                exec {
                    commandLine 'cmake',
                        '-G', 'Visual Studio 17 2022', '-A', 'x64',
                        '-DTINY3D_BUILD_RTTR_TOOL=ON',
                        '-S', sourceDir.absolutePath,
                        '-B', rppBuildDir.absolutePath
                }
                exec {
                    commandLine 'cmake',
                        '--build', rppBuildDir.absolutePath,
                        '--config', buildTypeCapitalized,
                        '--target', 'ReflectionPreprocessor'
                }
            }
        }
    }

    def nativeBuildTask = tasks.findByName("externalNativeBuild${buildTypeCapitalized}")
    if (nativeBuildTask != null) {
        nativeBuildTask.dependsOn taskName
    } else {
        tasks.matching { it.name == "externalNativeBuild${buildTypeCapitalized}" }.all {
            it.dependsOn taskName
        }
    }
}

dependencies {
    implementation project(':Tiny3DLib:Tiny3D')

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
